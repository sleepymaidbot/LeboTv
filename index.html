<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LeboTV — Media Hub</title>
    <link rel="shortcut icon" href="./assets/lebotv.png" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #08080a;
        --card: rgba(255, 255, 255, 0.03);
        --card-hover: rgba(255, 255, 255, 0.06);
        --card-border: rgba(255, 255, 255, 0.06);
        --gold: #c9a84c;
        --gold-light: #e4c76b;
        --gold-glow: rgba(201, 168, 76, 0.12);
        --gold-border: rgba(201, 168, 76, 0.3);
        --text: #ebebeb;
        --text-dim: #6b6b6b;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        font-family: "Inter", system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
      }

      /* Header */
      header {
        position: sticky;
        top: 0;
        z-index: 100;
        height: 60px;
        padding: 0 2rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: rgba(8, 8, 10, 0.6);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-bottom: 1px solid var(--card-border);
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        text-decoration: none;
        color: inherit;
      }
      .logo img { height: 32px; }
      .logo span { font-size: 1.125rem; font-weight: 600; letter-spacing: -0.02em; }

      .header-cta a {
        display: inline-block;
        padding: 0.45rem 1.1rem;
        font-size: 0.8125rem;
        font-weight: 500;
        color: var(--text);
        text-decoration: none;
        border: 1px solid var(--card-border);
        border-radius: 8px;
        transition: all 0.2s;
      }
      .header-cta a:hover {
        border-color: var(--gold-border);
        color: var(--gold-light);
      }

      .menu-btn {
        display: none;
        background: none;
        border: none;
        cursor: pointer;
        width: 36px;
        height: 36px;
        position: relative;
        z-index: 1100;
      }
      .menu-btn span {
        display: block;
        position: absolute;
        left: 6px;
        width: 24px;
        height: 1.5px;
        background: var(--text);
        border-radius: 1px;
        transition: all 0.25s ease;
      }
      .menu-btn span:nth-child(1) { top: 12px; }
      .menu-btn span:nth-child(2) { top: 17.5px; }
      .menu-btn span:nth-child(3) { top: 23px; }
      .menu-btn.active span:nth-child(1) { transform: rotate(45deg); top: 17.5px; }
      .menu-btn.active span:nth-child(2) { opacity: 0; }
      .menu-btn.active span:nth-child(3) { transform: rotate(-45deg); top: 17.5px; }

      .overlay {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 1000;
        background: rgba(8, 8, 10, 0.98);
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }
      .overlay.active { display: flex; }
      .overlay a {
        display: inline-block;
        padding: 0.6rem 1.5rem;
        color: var(--text);
        text-decoration: none;
        font-size: 1rem;
        font-weight: 500;
        border: 1px solid var(--card-border);
        border-radius: 8px;
      }

      /* Main */
      main {
        position: relative;
        z-index: 1;
        padding: 5rem 2rem 6rem;
        max-width: 1060px;
        margin: 0 auto;
      }

      .hero {
        margin-bottom: 4rem;
      }
      .hero h1 {
        font-size: clamp(2rem, 4.5vw, 2.75rem);
        font-weight: 600;
        letter-spacing: -0.035em;
        line-height: 1.15;
        margin-bottom: 0.625rem;
      }
      .hero p {
        color: var(--text-dim);
        font-size: 1rem;
        max-width: 380px;
        line-height: 1.55;
      }

      /* Grid */
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0.75rem;
      }

      .card {
        background: var(--card);
        backdrop-filter: blur(40px);
        -webkit-backdrop-filter: blur(40px);
        border: 1px solid var(--card-border);
        border-radius: 14px;
        padding: 2rem 1.5rem;
        transition: all 0.35s ease;
        position: relative;
        overflow: hidden;
      }

      .card::after {
        content: "";
        position: absolute;
        inset: 0;
        opacity: 0;
        background: radial-gradient(
          400px circle at var(--mx, 50%) var(--my, 50%),
          var(--gold-glow),
          transparent 60%
        );
        transition: opacity 0.4s ease;
        pointer-events: none;
      }

      .card:hover {
        background: var(--card-hover);
      }
      .card:hover::after {
        opacity: 1;
      }
      .card:hover .card-name {
        color: var(--gold-light);
      }
      .card:hover .card-icon {
        border-color: var(--gold-border);
        background: rgba(201, 168, 76, 0.06);
      }

      .card a {
        color: inherit;
        text-decoration: none;
        display: flex;
        flex-direction: column;
        position: relative;
        z-index: 1;
      }

      .card-icon {
        width: 44px;
        height: 44px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 1.125rem;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.06);
        transition: all 0.35s ease;
      }
      .card-icon img {
        width: 24px;
        height: 24px;
        object-fit: contain;
      }
      .card-icon img.invert {
        filter: invert(1) brightness(1.1);
      }
      .card-icon .letter {
        font-size: 1rem;
        font-weight: 600;
        color: var(--gold);
      }

      .card-name {
        font-size: 0.9375rem;
        font-weight: 600;
        margin-bottom: 0.25rem;
        transition: color 0.3s ease;
      }
      .card-desc {
        font-size: 0.8125rem;
        line-height: 1.5;
        color: var(--text-dim);
      }

      .card-badge {
        position: absolute;
        top: 0;
        right: 0;
        padding: 0.2rem 0.6rem;
        font-size: 0.625rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        background: rgba(220, 38, 38, 0.15);
        color: #f87171;
        border-bottom-left-radius: 8px;
        border-top-right-radius: 14px;
        z-index: 2;
      }

      /* Entrance */
      .card {
        opacity: 0;
        animation: enter 0.4s ease forwards;
      }
      .card:nth-child(1) { animation-delay: 0s; }
      .card:nth-child(2) { animation-delay: 0.04s; }
      .card:nth-child(3) { animation-delay: 0.08s; }
      .card:nth-child(4) { animation-delay: 0.12s; }
      .card:nth-child(5) { animation-delay: 0.16s; }
      .card:nth-child(6) { animation-delay: 0.2s; }
      .card:nth-child(7) { animation-delay: 0.24s; }
      .card:nth-child(8) { animation-delay: 0.28s; }
      .card:nth-child(9) { animation-delay: 0.32s; }

      @keyframes enter {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }

      footer {
        position: relative;
        z-index: 1;
        padding: 2.5rem 2rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        max-width: 1060px;
        margin: 0 auto;
        border-top: 1px solid var(--card-border);
        color: var(--text-dim);
        font-size: 0.8125rem;
      }
      footer a {
        color: var(--text-dim);
        text-decoration: none;
        transition: color 0.2s;
      }
      footer a:hover { color: var(--gold-light); }

      @media (max-width: 768px) {
        .header-cta { display: none; }
        .menu-btn { display: block; }
        header { padding: 0 1.25rem; }
        main { padding: 3.5rem 1.25rem 4rem; }
        .hero { margin-bottom: 2rem; }
        .grid {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 0.5rem;
          background: none;
          border: none;
          border-radius: 0;
        }
        .card {
          width: 90%;
          padding: 0.75rem 1rem;
          border-radius: 12px;
          flex-direction: row;
          align-items: center;
        }
        .card a {
          flex-direction: row;
          align-items: flex-start;
          gap: 0.875rem;
        }
        .card-icon {
          margin-bottom: 0;
          margin-top: 0.125rem;
          width: 40px;
          height: 40px;
          flex-shrink: 0;
        }
        .card-text {
          flex: 1;
          min-width: 0;
        }
        .card-name {
          margin-bottom: 0.125rem;
          font-size: 0.875rem;
        }
        .card-desc {
          font-size: 0.75rem;
          line-height: 1.45;
        }
        footer {
          flex-direction: column;
          gap: 0.5rem;
          text-align: center;
        }
      }

      @media (min-width: 769px) and (max-width: 960px) {
        .grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
    </style>
  </head>

  <body>
    <header>
      <a href="/" class="logo">
        <img src="./assets/lebotv.png" alt="LeboTV" />
        <span>LeboTV</span>
      </a>
      <div class="header-cta">
        <a href="https://discord.gg/c4tCcbSHEh" target="_blank" rel="noopener">Join Discord</a>
      </div>
      <button class="menu-btn" id="menu-btn" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </header>

    <div class="overlay" id="overlay">
      <a href="https://discord.gg/c4tCcbSHEh" target="_blank" rel="noopener">Join Discord</a>
    </div>

    <main>
      <section class="hero">
        <h1>Media hub</h1>
        <p>All your services in one place. Movies, TV, music.</p>
      </section>
      <div class="grid" id="grid"></div>
    </main>

    <footer>
      <span>LeboTV</span>
      <a href="https://discord.gg/c4tCcbSHEh" target="_blank" rel="noopener">Discord</a>
    </footer>

    <script>
      const DEFAULT_SERVICES = {
        baseUrl: "https://svip.sytes.net",
        services: [
          { name: "Radarr", description: "Movie collection manager for Usenet and BitTorrent.", image: "./assets/radarr.svg", path: "/radarr" },
          { name: "Sonarr", description: "TV show collection manager for Usenet and BitTorrent.", image: "./assets/sonarr.svg", path: "/sonarr" },
          { name: "Lidarr", description: "Music collection manager for Usenet and BitTorrent.", image: "./assets/lidarr.png", path: "/lidarr" },
          { name: "Prowlarr", description: "Indexer manager — syncs trackers across all *arr apps.", image: "./assets/prowlarr.svg", path: "/prowlarr" },
          { name: "Emby", description: "Personal media server and entertainment hub.", image: "./assets/emby.png", path: "/emby" },
          { name: "Jellyfin", description: "Free and open-source media server.", image: "./assets/jellyfin.svg", path: "/jellyfin" },
          { name: "Navidrome", description: "Personal music streaming server.", image: "./assets/navidrome.png", link: "http://nixos:4533", badge: "Tailscale only" },
          { name: "qBittorrent", description: "Free cross-platform BitTorrent client.", image: "./assets/New_qBittorrent_Logo.svg", link: "http://qbit.ecorte.xyz" },
          { name: "Tidarr", description: "Tidal media downloader — music, albums, playlists.", image: "./assets/tidarr.png", link: "http://nixos:8484", invert: true, badge: "Tailscale only" },
        ],
      };

      function buildLink(base, path) {
        if (path.startsWith(":")) return base + path;
        return base.replace(/\/$/, "") + (path || "");
      }

      function render(config) {
        const grid = document.getElementById("grid");
        grid.innerHTML = "";
        config.services.forEach((s) => {
          const link = s.link || buildLink(config.baseUrl, s.path);
          const card = document.createElement("div");
          card.className = "card";
          const invertClass = s.invert ? " invert" : "";
          const icon = s.image
            ? `<img class="${invertClass}" src="${s.image}" alt="${s.name}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='block'" /><span class="letter" style="display:none">${s.name[0]}</span>`
            : `<span class="letter">${s.name[0]}</span>`;
          const badge = s.badge ? `<div class="card-badge">${s.badge}</div>` : "";
          card.innerHTML = `
            ${badge}
            <a href="${link}" target="_blank" rel="noopener">
              <div class="card-icon">${icon}</div>
              <div class="card-text">
                <div class="card-name">${s.name}</div>
                <div class="card-desc">${s.description}</div>
              </div>
            </a>
          `;
          card.addEventListener("mousemove", (e) => {
            const r = card.getBoundingClientRect();
            card.style.setProperty("--mx", `${e.clientX - r.left}px`);
            card.style.setProperty("--my", `${e.clientY - r.top}px`);
          });
          grid.appendChild(card);
        });
      }

      (async () => {
        try {
          const r = await fetch("./services.json");
          if (r.ok) { render(await r.json()); return; }
        } catch (_) {}
        render(DEFAULT_SERVICES);
      })();

      document.addEventListener("DOMContentLoaded", () => {
        const btn = document.getElementById("menu-btn");
        const ov = document.getElementById("overlay");
        btn.addEventListener("click", () => {
          ov.classList.toggle("active");
          btn.classList.toggle("active");
          document.body.style.overflow = ov.classList.contains("active") ? "hidden" : "";
        });
      });
    </script>
  </body>
</html>
